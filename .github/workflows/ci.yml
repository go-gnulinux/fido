name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A workflow that fails to PARSE reports nothing at all: no jobs run, no
  # checks appear, and the pull request looks unexercised rather than broken.
  actionlint:
    name: workflows parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  linux:
    name: linux (the real target, CGO=0)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Tidy is committed
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -coverprofile=cover.out ./...
      # A runner has no security key, so hidraw_linux.go -- the ioctls, the
      # poll loop, the writes -- is never reached and the number here is below
      # 100. The GATE lives on the darwin lane, where the only code compiled is
      # the portable half plus the stubs, so 100% means all of it.
      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -8
      # /dev/uhid is the kernel's userspace HID transport: it makes a REAL
      # hidraw node from a report descriptor, so the wire half of this package
      # -- the sysfs walk, the ioctl numbers, the report-id byte, the poll loop
      # -- is exercised without a security key and without anyone to touch one.
      - name: Load uhid if this runner can
        id: uhid
        run: |
          sudo modprobe uhid 2>/dev/null || {
            sudo apt-get update -qq >/dev/null 2>&1 || true
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || true
            sudo modprobe uhid 2>/dev/null || true
          }
          if [ -c /dev/uhid ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Test against a kernel-made HID device
        if: steps.uhid.outputs.have == 'yes'
        run: sudo -E env "PATH=$PATH" go test -run TestAgainstAKernelMadeDevice -v ./...
      # A skip that looks like a pass is worse than no test, so when the runner
      # cannot provide uhid this says so where a person will see it.
      - name: Say plainly that the wire test did not run
        if: steps.uhid.outputs.have != 'yes'
        run: |
          echo "::warning::no /dev/uhid on this runner ($(uname -r)); the wire half was NOT exercised here. It runs wherever the uhid module exists -- see uhid_linux_test.go."
      - name: Race
        run: CGO_ENABLED=1 go test -race ./...

  darwin:
    name: darwin (coverage gate on everything that needs no key)
    runs-on: macos-latest
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -coverprofile=cover.out .
      - name: 100% gate
        run: |
          go tool cover -func=cover.out | tee full.txt
          if grep -v '100\.0%' full.txt | grep -v '^total:'; then
            echo "::error::below 100% (lines above)"; exit 1
          fi

  windows:
    name: windows (stub build)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  crossbuild:
    name: cross-build every architecture Linux runs on
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The ioctl request numbers are ARITHMETIC, not four hexadecimal literals
      # per architecture, so they must hold everywhere. Compiling proves the
      # sizes and the syscall shapes agree; it does not prove the numbers, and
      # nothing here claims it does.
      - name: Build
        run: |
          for arch in amd64 arm64 arm 386 riscv64 ppc64le s390x loong64 mips64le; do
            echo "--- linux/$arch"
            GOOS=linux GOARCH="$arch" go build ./... || exit 1
          done
